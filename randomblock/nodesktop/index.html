<script>
// 사이트주소/randomblock/nodesktop : 바탕화면 없이 이 게임만 단독 실행한다.
// 사이트 루트의 index.html을 받아 <base href>(css·js·rbs/music 경로가 루트 기준)와 앱 플래그만 넣어 그린다. index.html에 모듈을 추가해도 여기는 고칠 필요 없다.
(function () {
  var APPID = 'rbs', DESK = false, root = new URL('../../', location.href);
  fetch(new URL('index.html', root), { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (h) {
    var flag = '<base href="' + root.href + '"><script>' + (DESK ? 'window.SITE_OPEN=' : 'window.SITE_APP=') + JSON.stringify(APPID) + ';<\/script>';
    h = h.replace(/<head([^>]*)>/i, function (m) { return m + flag; });
    h = h.replace(/<title>[^<]*<\/title>/i, '<title>' + document.title + '</title>');
    document.open(); document.write(h); document.close();
  }).catch(function () { location.replace(DESK ? root.href : new URL('?app=' + APPID + location.search.replace(/^\?/, '&'), root).href); });
})();
</script>
</body>
